'use strict';
const p=17,a=2,b=2,G={x:5,y:1},ORDER=19;
const mod=(x,m=p)=>((x%m)+m)%m;
function inv(x,m=p){x=mod(x,m);if(!x)throw Error('No existe inverso de cero');let [t,nt,r,nr]=[0,1,m,x];while(nr){const q=Math.floor(r/nr);[t,nt]=[nt,t-q*nt];[r,nr]=[nr,r-q*nr]}if(r!==1)throw Error('No existe inverso');return mod(t,m)}
function valid(P){return P===null||(Number.isInteger(P.x)&&Number.isInteger(P.y)&&P.x>=0&&P.x<p&&P.y>=0&&P.y<p&&mod(P.y*P.y)===mod(P.x**3+a*P.x+b))}
function add(P,Q){if(!P)return Q;if(!Q)return P;if(!valid(P)||!valid(Q))throw Error('Punto inválido');if(P.x===Q.x&&mod(P.y+Q.y)===0)return null;let s;if(P.x===Q.x&&P.y===Q.y)s=mod((3*P.x*P.x+a)*inv(2*P.y));else s=mod((Q.y-P.y)*inv(Q.x-P.x));const x=mod(s*s-P.x-Q.x);return {x,y:mod(s*(P.x-x)-P.y)}}
function mul(n,P=G){if(!Number.isInteger(n)||n<0)throw Error('Escalar inválido');let R=null,Q=P;while(n){if(n%2)R=add(R,Q);Q=add(Q,Q);n=Math.floor(n/2)}return R}
const fmt=P=>P?`(${P.x},${P.y})`:'O (punto en el infinito)';
const eq=(P,Q)=>P===null?Q===null:Q!==null&&P.x===Q.x&&P.y===Q.y;
const tests=[['G pertenece a la curva',valid(G)],['2G = (6,3)',eq(mul(2),{x:6,y:3})],['4G = (3,1)',eq(mul(4),{x:3,y:1})],['5G = (9,16)',eq(mul(5),{x:9,y:16})],['7G = (0,6)',eq(mul(7),{x:0,y:6})],['16G = (10,11)',eq(mul(16),{x:10,y:11})],['19G = O',mul(19)===null],['Inverso de 5 módulo 17 = 7',inv(5)===7],['Conmutatividad de suma',eq(add(mul(4),mul(7)),add(mul(7),mul(4)))],['Secreto de Ana y Carlos coincide',eq(mul(5,mul(7)),mul(7,mul(5)))],['Secreto esperado = (10,11)',eq(mul(5,mul(7)),{x:10,y:11})]];
for(let i=1;i<19;i++)tests.push([`Orden mínimo: ${i}G no es O`,mul(i)!==null]);
console.table(tests.map(([prueba,correcto])=>({prueba,correcto})));if(tests.some(t=>!t[1]))throw Error('Falló una prueba matemática');

const scripts=[
[['Ana','Carlos, si EVA ve la red, ¿cómo compartimos algo secreto?'],['Carlos','¡Sin enviar el secreto! Cada uno hará sus propios cálculos.'],['Curvi','Soy Curvi. Usaremos ECDH: dos caminos distintos para llegar al mismo secreto. Mira mi guía paso a paso.']],
[['Curvi','Nuestra regla es y² ≡ x³ + 2x + 2 (mod 17). Primero probamos si un punto la cumple.'],['Curvi','x e y son las coordenadas. Los dos números 2 definen esta curva. El 17 es el número por el que dividimos para quedarnos con el resto.'],['Curvi','Por ejemplo, (5,1) sirve: ambos lados dejan resto 1. ¡Por eso G está en nuestra curva!']],
[['Curvi','Partimos de G=(5,1), un punto que todos conocen.'],['Curvi','2G significa sumar G consigo mismo con una regla especial. ¡No duplicamos x e y!'],['Curvi','Cada vez que pulses «Sumar G», verás el siguiente punto. Al llegar a 19G aparece O y el ciclo termina.']],
[['Ana','Mi clave privada es un número que solo yo conozco.'],['Carlos','Mi clave privada también es secreta. Podemos elegir entre 1 y 18 en este ejemplo.'],['Curvi','El 19 es el orden de G, por eso usamos números privados menores que 19. Puedes cambiar ambos valores.']],
[['Curvi','La máquina de Ana suma G tantas veces como indica su número privado.'],['Ana','Mi clave pública se obtiene multiplicando mi número privado por G.'],['Curvi','La de Carlos hace lo mismo con su propio número. ¡Los puntos resultantes sí se pueden compartir!']],
[['Ana','Envío mi punto público a Carlos. No envío mi número privado.'],['Carlos','Yo envío mi punto público a Ana. EVA puede ver ambos sobres.'],['Curvi','Ver las claves públicas no equivale a conocer las privadas. ¡Pero debemos autenticar los sobres para evitar suplantaciones!']],
[['Ana','Tomo el punto público de Carlos y lo multiplico por mi número privado.'],['Carlos','Yo tomo el punto público de Ana y lo multiplico por el mío.'],['Curvi','Ambos cálculos coinciden porque a(bG)=b(aG). Luego una KDF convierte ese resultado en claves para cifrar.']],

];

{q:'¿Qué es una curva elíptica en este juego?',o:['Una línea dibujada al azar','Un conjunto de puntos que satisface una ecuación','Una contraseña'],a:1,e:'Los puntos válidos cumplen y² ≡ x³ + 2x + 2 (mod 17).'},
{q:'¿Qué representa el punto generador G?',o:['Un punto público de partida','La clave secreta de Ana','El mensaje cifrado'],a:0,e:'G es el punto público que ambos usan para obtener otros puntos mediante sumas.'},

function svgActor(name){const colors={Ana:['#c69bff','#302d62','#ffccac'],Carlos:['#57d8e2','#25385b','#c18d70'],Curvi:['#b8ff79','#23535c','#e4ffe5'],EVA:['#ff78a8','#382440','#b5a1bd']};const [shirt,hair,skin]=colors[name];if(name==='Curvi')return `<svg viewBox="0 0 130 160" aria-label="Curvi, guía con forma de curva"><path class="leg" d="M48 114 L35 148 M82 114 L94 148" stroke="${shirt}" stroke-width="9" stroke-linecap="round"/><path class="arm" d="M29 83 L5 66 M98 83 L124 65" stroke="${shirt}" stroke-width="9" stroke-linecap="round"/><path d="M15 92 Q38 -4 68 63 T119 35" fill="none" stroke="${shirt}" stroke-width="18" stroke-linecap="round"/><ellipse cx="67" cy="86" rx="39" ry="31" fill="${hair}" stroke="${shirt}" stroke-width="4"/><ellipse class="eye" cx="54" cy="79" rx="5" ry="8" fill="white"/><ellipse class="eye" cx="80" cy="79" rx="5" ry="8" fill="white"/><path d="M56 97 Q67 110 79 96" fill="none" stroke="white" stroke-width="3" stroke-linecap="round"/></svg>`;return `<svg viewBox="0 0 140 205" aria-label="${name}, personaje animado"><ellipse cx="70" cy="197" rx="40" ry="6" fill="#0006"/><path class="leg" d="M53 150 L48 193" stroke="#292b4e" stroke-width="15" stroke-linecap="round"/><path class="leg" d="M86 150 L92 193" stroke="#292b4e" stroke-width="15" stroke-linecap="round"/><path d="M38 95 Q70 83 102 95 L107 153 Q70 168 33 153Z" fill="${shirt}"/><path class="arm" d="M37 104 Q19 119 22 142" fill="none" stroke="${skin}" stroke-width="12" stroke-linecap="round"/><path class="arm" d="M103 103 Q121 113 119 139" fill="none" stroke="${skin}" stroke-width="12" stroke-linecap="round"/><rect x="61" y="77" width="18" height="23" rx="8" fill="${skin}"/><ellipse cx="70" cy="52" rx="35" ry="40" fill="${skin}"/><path d="M35 54 Q22 4 70 7 Q117 1 107 62 Q97 34 87 27 Q55 42 35 54" fill="${hair}"/><ellipse class="eye" cx="57" cy="56" rx="4" ry="6" fill="#15162d"/><ellipse class="eye" cx="83" cy="56" rx="4" ry="6" fill="#15162d"/><path d="M59 74 Q70 82 81 73" stroke="#8b465f" stroke-width="3" fill="none" stroke-linecap="round"/><text x="70" y="186" text-anchor="middle" font-size="12" font-weight="bold" fill="white">${name}</text></svg>`}

function plot(highlight=null,interactive=false){const s=15,margin=20;let dots='';for(let x=0;x<17;x++)for(let y=0;y<17;y++){if(valid({x,y}))dots+=`<circle class="point" data-x="${x}" data-y="${y}" cx="${margin+x*s}" cy="${margin+(16-y)*s}" r="3.2" fill="${highlight&&highlight.x===x&&highlight.y===y?'#b9ff75':'#5eead4'}" ${interactive?'':'pointer-events="none"'}/>`}let grid='';for(let i=0;i<17;i++){let z=margin+i*s;grid+=`<path d="M${z} ${margin}V${margin+16*s} M${margin} ${z}H${margin+16*s}" stroke="#ffffff16" stroke-width=".7"/>`;if(i%4===0)grid+=`<text x="${z}" y="${margin+16*s+14}" text-anchor="middle">${i}</text><text x="${margin-9}" y="${margin+(16-i)*s+3}" text-anchor="middle">${i}</text>`}return `<svg class="plot" viewBox="0 0 285 290" role="img" aria-label="Puntos válidos sobre la curva módulo 17">${grid}${dots}${highlight?`<circle cx="${margin+highlight.x*s}" cy="${margin+(16-highlight.y)*s}" r="9" fill="none" stroke="#b9ff75" stroke-width="2"><animate attributeName="r" values="7;12;7" dur="1.2s" repeatCount="indefinite"/></circle>`:''}</svg>`}

creto: ${fmt(SA)}</div></div>`);default:return ''}}
function sceneControls(){switch(scene){case 0:return `<button id="observe" class="primary">Ver lo que observa EVA</button>`;case 1:return `<button id="mode" class="primary">${plotMode==='continuous'?'Ver campo finito':'Ver curva continua'}</button><button id="testpoint">Probar punto (5,1)</button>`;case 2:return `<button id="sum" class="primary" ${stepG>=19?'disabled':''}>Sumar G</button><button id="resetG">Volver a G</button>`;case 3:return `<label>Ana <b id="av">${ana}</b><input aria-label="Clave privada de Ana" class="slider" id="ana" type="range" min="1" max="18" value="${ana}"></label><label>Carlos <b id="cv">${carlos}</b><input aria-label="Clave privada de Carlos" class="slider" id="carlos" type="range" min="1" max="18" value="${carlos}"></label><button id="random" class="primary">Generar claves aleatorias seguras</button><button id="resetKeys">Restablecer ejemplo (5 y 7)</button><p class="hint" id="currentKeys">Valores activos: Ana = ${ana}, Carlos = ${carlos}. El ejemplo original usa 5 y 7.</p>`;case 4:return `<button id="run" class="primary">Activar máquinas</button><span class="hint">QA=${fmt(mul(ana))} · QB=${fmt(mul(carlos))}</span>`;case 5:return `<button id="auto" class="primary">Entregar sobres (accesible)</button><span class="hint">Arrastra cada sobre al destinatario, o usa el botón.</span>`;case 6:return `<button id="run" class="primary">Calcular secretos</button><span class="hint">dA·QB = dB·QA = ${fmt(mul(ana,mul(carlos)))}</span>`;case 7:return `<div id="quiz"></div><button id="laboratory">Abrir laboratorio libre</button><div id="lab" hidden></div>`;default:return ''}}
function pointWalk(label,k){
 const P=mul(k), Q=G, R=add(P,Q);
 if(!P||!Q||!R)return `${label}: ${k}G=${fmt(P)}; al sumar G obtenemos ${fmt(R)}.`;
 const same=P.x===Q.x&&P.y===Q.y;
 const numerator=same?3*P.x*P.x+a:Q.y-P.y;
 const denominator=same?2*P.y:Q.x-P.x;
 const inverse=inv(denominator);
 const lambda=mod(numerator*inverse);
 const rawX=lambda*lambda-P.x-Q.x;
 const rawY=lambda*(P.x-R.x)-P.y;
 return `${label}: P=${k}G=${fmt(P)} y Q=G=${fmt(Q)}\n${same?'Duplicación P+P':'Suma de puntos P+Q'}\nλ = (${same?`3·${P.x}²+${a}`:`${Q.y}−${P.y}`})·(${same?`2·${P.y}`:`${Q.x}−${P.x}`})⁻¹ mod 17\nNumerador=${numerator}; denominador=${denominator}; inverso modular=${inverse}\nλ = (${numerator}·${inverse}) mod 17 = ${lambda}\nx₃ = (${lambda}²−${P.x}−${Q.x}) mod 17 = ${rawX} mod 17 = ${R.x}\ny₃ = [${lambda}(${P.x}−${R.x})−${P.y}] mod 17 = ${rawY} mod 17 = ${R.y}\nResultado: ${k}G+G=${k+1}G=${fmt(R)}.`;
}
function doublingWalk(label,k){
 const P=mul(k),R=add(P,P);if(!P||!R)return `${label}: ${k}G=${fmt(P)}; al duplicarlo obtenemos ${fmt(R)}.`;
 const num=3*P.x*P.x+a,den=2*P.y,iv=inv(den),lam=mod(num*iv),xx=lam*lam-2*P.x,yy=lam*(P.x-R.x)-P.y;
 return `${label}: P=${k}G=${fmt(P)}\nλ = (3·${P.x}²+${a})·(2·${P.y})⁻¹ mod 17\nNumerador=${num}; denominador=${den}; inverso modular=${iv} (porque ${den}·${iv} mod 17 = 1)\nλ = ${num}·${iv} mod 17 = ${lam}\nx₃ = (${lam}²−${P.x}−${P.x}) mod 17 = ${xx} mod 17 = ${R.x}\ny₃ = [${lam}(${P.x}−${R.x})−${P.y}] mod 17 = ${yy} mod 17 = ${R.y}\nResultado: ${k}G+${k}G=${2*k}G=${fmt(R)}.`;
}
function activeWalkExamples(){
 const kA=ana===18?17:ana, kB=carlos===18?17:carlos;
 return `\n\nEJEMPLOS CALCULADOS CON TUS CLAVES ACTIVAS\nAna: dA=${ana}; QA=${ana}G=${fmt(mul(ana))}\nCarlos: dB=${carlos}; QB=${carlos}G=${fmt(mul(carlos))}\n\n${pointWalk('Suma basada en la clave de Ana',kA)}\n\n${doublingWalk('Duplicación basada en la clave de Carlos',carlos)}\n\nLos puntos y las pendientes se recalculan al cambiar las claves. Si un cálculo llega a O, se muestra el punto en el infinito.`;
}
function mathContent(){const QA=mul(ana),QB=mul(carlos),SA=mul(ana,QB);const base=`Curva: y² ≡ x³ + 2x + 2 (mod 17)\np=17: módulo de las coordenadas. a=2, b=2: parámetros.\nG=(5,1), n=19: orden de G; 19G=O.\n\nCÓMO LEER LAS FÓRMULAS DE SUMA DE PUNTOS

Primero llamamos P=(x₁,y₁) al primer punto y Q=(x₂,y₂) al segundo. Las letras x e y son coordenadas. Los subíndices 1 y 2 indican a qué punto pertenece cada coordenada.

1) SUMA DE DOS PUNTOS DISTINTOS (P+Q)
λ = (y₂−y₁)·(x₂−x₁)⁻¹ mod 17

• λ (lambda) es una pendiente: nos ayuda a encontrar el punto siguiente.
• y₂−y₁ es la diferencia entre las alturas de los puntos.
• x₂−x₁ es la diferencia entre sus posiciones horizontales.
• El exponente ⁻¹ NO significa cambiar el signo: significa «inverso modular», que sirve para dividir en este sistema.
• «mod 17» indica que conservamos el resto al dividir entre 17, ajustado a un número entre 0 y 16.

EJEMPLO DINÁMICO: se calcula usando la clave privada actual de Ana. Consulta los pasos al final de este panel.\n\n2) DUPLICACIÓN: SUMAR UN PUNTO CONSIGO MISMO (P+P)
λ = (3x₁²+a)·(2y₁)⁻¹ mod 17

• Se usa otra fórmula para λ porque los dos puntos son el mismo.
• x₁ e y₁ son las coordenadas de P.
• a=2 es un valor fijo de nuestra curva, no una clave privada.
• Primero calculamos 3 veces x₁ al cuadrado y sumamos a.
• Después multiplicamos por el inverso modular de 2 veces y₁.

EJEMPLO DINÁMICO: se duplica el punto calculado con la clave actual de Carlos. Consulta los pasos al final de este panel.\n\n3) OBTENER LAS COORDENADAS DEL NUEVO PUNTO
x₃ = (λ²−x₁−x₂) mod 17
y₃ = [λ(x₁−x₃)−y₁] mod 17

• x₃ e y₃ son las coordenadas del punto que acabamos de calcular.
• Estas dos fórmulas son iguales para suma y duplicación: solo cambia cómo calculamos λ.
• En la duplicación, Q=P: por eso x₂=x₁ y y₂=y₁.
• Si P y Q tienen la misma x y alturas opuestas módulo 17, el resultado es O (punto en el infinito), no un punto con coordenadas.

RECUERDA: inverso modular de un número t es otro número u tal que t·u deja resto 1 al dividir entre 17. No se divide de forma habitual ni se suman las coordenadas directamente.`+activeWalkExamples();switch(scene){case 0:return 'ECDH = Elliptic Curve Diffie–Hellman. Dos personas publican puntos y combinan un escalar secreto con el punto público ajeno. Sin autenticación, EVA podría sustituir puntos (ataque de intermediario).';case 1:return base+'\n\nEjemplo G: 1² mod 17 = 1; (5³+2·5+2) mod 17 = 137 mod 17 = 1. G sí pertenece a la curva.';case 2:return base+`\n\nSecuencia calculada: ${Array.from({length:19},(_,i)=>`${i+1}G=${fmt(mul(i+1))}`).join(' · ')}`;case 3:return `Las claves privadas son escalares enteros d∈{1,…,18}.\nEl orden de G es n=19, por eso 1≤d<n.\nEn la práctica deben generarse con un generador criptográficamente seguro.\nNo se comparten los valores privados.`;case 4:return base+`\n\nAna: QA=${ana}G=${fmt(QA)}\nCarlos: QB=${carlos}G=${fmt(QB)}\n\nPara multiplicar eficientemente se usa duplicación y suma (double-and-add).`;case 5:return `Se envía QA=${fmt(QA)} y QB=${fmt(QB)}.\nNO se envía dA=${ana} ni dB=${carlos}.\nEsta curva de 19 puntos es insegura: EVA puede probar 18 posibilidades. En sistemas reales se usan grupos grandes y validación de claves públicas.`;case 6:return `QA=${ana}G=${fmt(QA)}\nQB=${carlos}G=${fmt(QB)}\nSA=${ana}QB=${fmt(SA)}\nSB=${carlos}QA=${fmt(mul(carlos,QA))}\n${ana}(${carlos}G)=${carlos}(${ana}G)=${ana*carlos}G=${mod(ana*carlos,ORDER)}G=${fmt(SA)}.\n\nComprobación con los valores activos: ${ana}(${carlos}G)=${carlos}(${ana}G)=${ana*carlos}G=${mod(ana*carlos,ORDER)}G=${fmt(SA)}.\nEl punto se transforma mediante una KDF en claves simétricas. Se requiere autenticación para evitar un ataque de intermediario.`;case 7:return base+`\n\nLaboratorio: QA=${fmt(QA)}, QB=${fmt(QB)}, S=${fmt(SA)}.\nPruebas automáticas: ${tests.filter(t=>t[1]).length}/${tests.length} superadas.`}}
function formulaEnPalabras(){
 const QA=mul(ana),QB=mul(carlos),S=mul(ana,QB), k=mod(ana*carlos,ORDER);
 const common=`Cuando ves «módulo 17», significa que divides entre 17 y te quedas con el resto. Cuando ves «G», hablamos del punto público (5,1). El 19, en cambio, indica cuántas veces sumamos G hasta llegar al punto especial O.`;
 switch(scene){
 case 0:return `ECDH es el nombre de una forma de ponerse de acuerdo en un secreto. Ana y Carlos pueden mostrar los resultados de algunos cálculos, pero cada uno guarda un número que EVA no ve. Así pueden llegar al mismo resultado sin enviarlo como mensaje.`;
 case 1:return `La fórmula «y al cuadrado es igual a x al cubo más dos veces x más dos, módulo 17» es una prueba para saber si un punto pertenece a nuestra curva. «x» es la posición horizontal y «y» la vertical. Los dos números 2 son características de la curva que elegimos. ${common} Por ejemplo, con el punto (5,1), el lado izquierdo vale 1. El derecho vale 137, que al dividirlo entre 17 deja resto 1. ¡Coinciden!`;
 case 2:return `La expresión «${stepG}G» quiere decir que hemos sumado el punto G consigo mismo ${stepG} veces, siguiendo una regla especial. No multiplicamos las coordenadas por ${stepG}. El resultado actual es ${fmt(mul(stepG))}. Para encontrar el siguiente punto se calcula una pendiente, se usa un número que permite dividir dentro del módulo 17 y se obtienen nuevas coordenadas. ${common} Al llegar a 19G obtenemos O, que marca el cierre del ciclo.`;
 case 3:return `La expresión «1 ≤ d < 19» se lee: «d puede ser cualquier número entero desde 1 hasta 18». La letra d representa la clave privada. Ana tiene dA=${ana} y Carlos dB=${carlos}. Elegimos este intervalo porque 19 sumas de G producen O; no queremos usar ese resultado como clave pública. Los números privados nunca se mandan por la red.`;
 case 4:return `«QA = dA × G» significa: toma el número secreto de Ana (${ana}) y suma el punto G consigo mismo ${ana} veces usando las reglas de la curva. Así aparece su punto público ${fmt(QA)}. Carlos hace lo mismo con ${carlos} y obtiene ${fmt(QB)}. En las fórmulas, «lambda» es el nombre de la pendiente que ayuda a calcular el siguiente punto. «Inverso modular» significa el número que permite hacer una división trabajando con restos. Por ejemplo, al sumar G consigo mismo obtenemos 2G=(6,3), no (10,2). ${common}`;
 case 5:return `«QA» es el punto público de Ana: ${fmt(QA)}. «QB» es el de Carlos: ${fmt(QB)}. Los sobres llevan estos puntos, no los números privados ${ana} y ${carlos}. EVA puede ver los sobres, pero el objetivo es que no conozca las claves privadas. Ojo: nuestra curva es tan pequeña que no sería segura en Internet real; además, las claves públicas deben autenticarse.`;
 case 6:return `La fórmula «SA = dA × QB» se lee: «Ana toma el punto público que recibió de Carlos (${fmt(QB)}) y lo suma consigo mismo ${ana} veces». Carlos hace lo mismo con el punto público de Ana (${fmt(QA)}) y su número ${carlos}. Los dos obtienen ${fmt(S)}. ¿Por qué? Porque ambos cálculos equivalen a sumar G ${ana*carlos} veces. Como el ciclo de G tiene 19 pasos, ${ana*carlos} se reduce a ${k} dentro de ese ciclo. Después, una función llamada KDF transforma el resultado en una clave útil para cifrar; también hace falta autenticar a los participantes.`;
 case 7:return `La regla de la curva decide qué puntos se pueden usar. El punto G es el inicio común. Cada persona guarda un número privado y publica un punto calculado con ese número. Después combina su número privado con el punto público de la otra persona. Por ejemplo, ahora Ana usa ${ana}, Carlos ${carlos}, y ambos llegan a ${fmt(S)}. Recuerda: el 17 controla los restos de las coordenadas; el 19 marca la cantidad de sumas de G que llevan a O.`;
 }
}
function updateFormulaPanel(){
 const box=document.getElementById('mathbox');if(!box)return;
 box.hidden=!(math||simple);
 if(math){
   const raw=mathContent();
   const escapeHtml=t=>t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
   // Destacar las claves y puntos realmente activos sin alterar las operaciones.
   const tokens=[`(${ana},${carlos})`,fmt(mul(ana,mul(carlos))),fmt(mul(ana)),fmt(mul(carlos)),`${ana*carlos}G`,`${mod(ana*carlos,ORDER)}G`,`${ana}G`,`${carlos}G`,`dA=${ana}`,`dB=${carlos}`,`Numerador=`,`denominador=`,`inverso modular=`]
     .filter(Boolean).sort((a,b)=>b.length-a.length);
   const unique=[...new Set(tokens)];
   const escaped=escapeHtml(raw);
   const escapeRegex=t=>Array.from(t).map(c=>'\\^$.*+?()[]{}|'.includes(c)?'\\'+c:c).join('');
   const re=new RegExp(unique.map(escapeRegex).join('|'),'g');
   box.innerHTML=escaped.replace(re,m=>`<span class="math-active" title="Valor activo calculado">${m}</span>`);
 }else box.textContent=formulaEnPalabras();
 box.classList.toggle('plainformula',!math);
 const simpleBtn=document.getElementById('simple'),mathBtn=document.getElementById('math');
 if(simpleBtn){simpleBtn.classList.toggle('selected',!math);simpleBtn.setAttribute('aria-pressed',String(!math))}
 if(mathBtn){mathBtn.classList.toggle('selected',math);mathBtn.setAttribute('aria-pressed',String(math))}
}

function equalizeGuide(){const mission=document.querySelector('.below .mission'),side=document.querySelector('.below .side');if(!mission||!side)return;if(window.innerWidth<=900){side.style.height='auto';return;}side.style.height=mission.getBoundingClientRect().height+'px';}
window.addEventListener('resize',equalizeGuide);
function render(){if(typingTimer)clearInterval(typingTimer);if(scene<0){app.innerHTML=`<div class="welcome"><div><div class="tag">MISIÓN CRIPTOGRÁFICA · GRUPO 2</div><h1>ECDH: La aventura del secreto compartido</h1><p>¿Cómo pueden dos personas crear un mismo secreto sin enviarlo por Internet?</p><div class="actors">${['Ana','Curvi','Carlos','EVA'].map(svgActor).join('')}</div><button id="start" class="primary">¡Comenzar aventura!</button></div></div>`;document.getElementById('start').onclick=()=>go(0);return}app.innerHTML=`<header class="top"><div class="brand">✦ <span>ECDH</span> / MISIÓN SECRETA</div><div class="actions"><button id="topPrev" title="Escena anterior">← Anterior</button><button id="topNext" class="primary" title="Continuar a la siguiente escena">Continuar →</button><button id="sound" title="Activar o silenciar sonido">${muted?'Activar sonido':'Silenciar'}</button><button id="full">Pantalla completa</button><button id="home">Inicio</button></div></header><div class="progress"><div style="width:${(scene+1)/8*100}%"></div></div><div class="scenehead"><h1>${titles[scene]}</h1><div class="tag">ESCENA ${scene+1} / 8</div></div><section class="stage" id="stage">${cast(scene===1?['Curvi']:scene===2?['Curvi','Ana','Carlos']:scene===3?['Ana','Carlos','EVA']:scene===4?['Ana','Carlos','Curvi']:scene===5?['Ana','Carlos','EVA']:scene===6?['Ana','Carlos','Curvi']:['Ana','Carlos','Curvi','EVA'],scene===6?'celebrate':'')}<div class="speech"><div class="speaker" id="speaker"></div><p id="dialogue"></p><button id="nextSpeech" style="float:right;padding:3px 9px;font-size:12px">Siguiente diálogo ▸</button></div>${sceneContent()}</section><div class="below"><section class="panel mission"><h2>Tu misión</h2><p id="mission">${['Observa cómo viajan los mensajes por una red visible.','Explora qué puntos satisfacen la ecuación.','Suma G para descubrir los puntos de la curva.','Elige dos números que nadie más conozca.','Pon en marcha las máquinas y observa los puntos públicos.','Entrega cada sobre al destinatario correcto.','Comprueba que ambas máquinas llegan al mismo punto.','Responde preguntas y experimenta libremente.'][scene]}</p><div class="controls" id="controls">${sceneControls()}</div><div class="toggle" style="margin-top:12px"><button id="math" class="mathbutton">Ver matemáticas</button><button id="simple">Explicación sencilla</button><button id="replay">Repetir animación</button></div><div id="mathbox" class="mathbox plainformula">${formulaEnPalabras()}</div><div class="active-values"><h3 style="margin-top:18px">Valores activos del ejercicio</h3><p class="hint">Los ejemplos 5 y 7 son solo el punto de partida. Al cambiar las claves, los resultados también cambian.</p><div class="stat"><span>Privada de Ana (solo simulación)</span><b id="privateA">${ana}</b></div><div class="stat"><span>Privada de Carlos (solo simulación)</span><b id="privateB">${carlos}</b></div><div class="stat"><span>Campo p</span><b>17</b></div><div class="stat"><span>Orden n</span><b>19</b></div><div class="stat"><span>Generador G</span><b>(5,1)</b></div><div class="stat"><span>Pública de Ana</span><b id="qa">${fmt(mul(ana))}</b></div><div class="stat"><span>Pública de Carlos</span><b id="qb">${fmt(mul(carlos))}</b></div><div class="stat"><span>Secreto conjunto</span><b id="secret">${fmt(mul(ana,mul(carlos)))}</b></div><p class="notice">Demo educativa: curva pequeña insegura en producción. No cifra mensajes reales.</p></div></section><aside class="panel side">${guideHtml()}</aside></div><div class="nav"><button id="prev" ${scene===0?'disabled':''}>← Anterior</button><span class="hint">${scene+1} de 8</span><button id="next" class="primary">${scene===7?'Volver al inicio':'Siguiente escena →'}</button></div>`;bind();say(scripts[scene][speechIndex]||scripts[scene][0]);if(scene===7)renderQuiz();updateFormulaPanel();requestAnimationFrame(equalizeGuide)}
function sound(freq=550){if(muted)return;try{const C=window.AudioContext||window.webkitAudioContext;const ctx=window._audio||(window._audio=new C());const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(.04,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.13);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+.14)}catch(e){}}
function say([who,line]){if(typingTimer)clearInterval(typingTimer);const speaker=document.getElementById('speaker'),dialog=document.getElementById('dialogue');if(!speaker||!dialog)return;speaker.textContent=who;dialog.textContent='';let i=0;typingTimer=setInterval(()=>{dialog.textContent=line.slice(0,++i);if(i>=line.length)clearInterval(typingTimer)},18);sound(380)}
function go(n){scene=n;speechIndex=0;math=false;simple=true;busy=false;render()}
function updateMath(){updateFormulaPanel()}
function bind(){document.getElementById('prev').onclick=()=>go(scene-1);document.getElementById('next').onclick=()=>scene===7?go(-1):go(scene+1);document.getElementById('topPrev').onclick=()=>go(Math.max(0,scene-1));document.getElementById('topPrev').disabled=scene===0;document.getElementById('topNext').onclick=()=>scene===7?go(-1):go(scene+1);document.getElementById('topNext').textContent=scene===7?'Inicio ↺':'Continuar →';document.getElementById('home').onclick=()=>go(-1);document.getElementById('sound').onclick=()=>{muted=!muted;document.getElementById('sound').textContent=muted?'Activar sonido':'Silenciar';sound(800)};document.getElementById('full').onclick=()=>{if(!document.fullscreenElement){document.documentElement.requestFullscreen?.().catch(()=>{})}else document.exitFullscreen?.()};document.getElementById('nextSpeech').onclick=()=>{speechIndex=(speechIndex+1)%scripts[scene].length;say(scripts[scene][speechIndex])};document.getElementById('math').onclick=()=>{math=true;simple=false;updateFormulaPanel()};document.getElementById('simple').onclick=()=>{math=false;simple=true;updateFormulaPanel()};document.getElementById('replay').onclick=()=>{sound(620);speechIndex=0;if(scene===2)stepG=1;if(scene===5)delivered.clear();if(scene===1){plotMode='continuous';pointFeedback=''}render()};if(scene===0)document.getElementById('observe').onclick=()=>say(['EVA','Puedo leer los mensajes públicos que pasan por aquí... ¡pero no las claves privadas!']);if(scene===1){document.getElementById('mode').onclick=()=>{plotMode=plotMode==='continuous'?'finite':'continuous';render()};document.getElementById('testpoint').onclick=()=>checkPoint(5,1);document.querySelectorAll('.point').forEach(c=>c.onclick=()=>checkPoint(+c.dataset.x,+c.dataset.y));const svg=document.querySelector('.plot');svg.onclick=e=>{if(e.target.classList.contains('point'))return;const r=svg.getBoundingClientRect(),x=Math.round(((e.clientX-r.left)/r.width*285-20)/15),y=16-Math.round(((e.clientY-r.top)/r.height*290-20)/15);if(x>=0&&x<17&&y>=0&&y<17)checkPoint(x,y)}}if(scene===2){document.getElementById('sum').onclick=()=>{stepG++;sound(650);render()};document.getElementById('resetG').onclick=()=>{stepG=1;render()}}if(scene===3){for(const [id,who] of [['ana','ana'],['carlos','carlos']])document.getElementById(id).oninput=e=>{if(who==='ana')ana=+e.target.value;else carlos=+e.target.value;document.getElementById(who==='ana'?'av':'cv').textContent=e.target.value;refreshStats();updateMath()};document.getElementById('resetKeys').onclick=()=>{ana=5;carlos=7;render();say(['Curvi','Restablecimos el ejemplo original: Ana usa 5 y Carlos usa 7. Ahora las claves públicas son (9,16) y (0,6), y el secreto es (10,11).'])};document.getElementById('random').onclick=()=>{if(!crypto?.getRandomValues){say(['Curvi','Este navegador no permite obtener números aleatorios seguros aquí.']);return}ana=secureScalar();carlos=secureScalar();render();say(['Curvi',`¡Nuevas claves! Ana=${ana}, Carlos=${carlos}. Ahora QA=${fmt(mul(ana))}, QB=${fmt(mul(carlos))} y el secreto compartido es ${fmt(mul(ana,mul(carlos)))}. Estos resultados son distintos del ejemplo 5 y 7, ¡y eso es correcto!`])}}if(scene===4||scene===6)document.getElementById('run').onclick=()=>{busy=true;render();say(['Curvi','Las máquinas están calculando con sumas y duplicaciones reales...']);setTimeout(()=>{if(scene===4||scene===6){busy=false;render();say(['Curvi',scene===6?'¡Coinciden! Ambas rutas dan el mismo punto.':'¡Listo! Los puntos públicos se calcularon a partir de las claves privadas.']);sound(850)}},1000)};if(scene===5)bindDrag();if(scene===7){document.getElementById('laboratory').onclick=()=>{const el=document.getElementById('lab');el.hidden=!el.hidden;if(!el.hidden)renderLab()}}}
function secureScalar(){const arr=new Uint32Array(1);const limit=Math.floor(4294967296/18)*18;let n;do{crypto.getRandomValues(arr);n=arr[0]}while(n>=limit);return n%18+1}
function refreshStats(){document.getElementById('privateA').textContent=ana;document.getElementById('privateB').textContent=carlos;updateFormulaPanel();const guide=document.querySelector('.side .guide-steps');if(guide)guide.innerHTML=explanationSteps().map(([head,body],i)=>`<div class="guide-step"><b>${i+1}. ${head}</b><span>${body}</span></div>`).join('');const keys=document.getElementById('currentKeys');if(keys)keys.textContent=`Valores activos: Ana = ${ana}, Carlos = ${carlos}. El ejemplo original usa 5 y 7.`;document.getElementById('qa').textContent=fmt(mul(ana));document.getElementById('qb').textContent=fmt(mul(carlos));document.getElementById('secret').textContent=fmt(mul(ana,mul(carlos)))}
function checkPoint(x,y){const P={x,y},ok=valid(P);pointFeedback=`${fmt(P)}: ${ok?'¡sí pertenece!':'no pertenece.'} ${y}² mod 17 = ${mod(y*y)}; (x³+2x+2) mod 17 = ${mod(x**3+2*x+2)}.`;document.getElementById('pointfeedback').textContent=pointFeedback;say(['Curvi',pointFeedback]);sound(ok?800:240)}
function deliver(which){if(delivered.has(which))return;delivered.add(which);const recipient=which==='A'?'Carlos':'Ana';say([recipient,`¡Recibí la clave pública de ${which==='A'?'Ana':'Carlos'}! No es un número privado.`]);sound(750);document.getElementById('envelope'+which)?.remove();document.getElementById('drop'+(which==='A'?'B':'A')).innerHTML=recipient+'<br>✓ Recibido';if(delivered.size===2)say(['Curvi','¡Ambas claves públicas llegaron! EVA las vio, pero no conoce los secretos privados.'])}
function bindDrag(){document.getElementById('auto').onclick=()=>{deliver('A');deliver('B')};for(const el of document.querySelectorAll('.envelope')){el.addEventListener('dragstart',e=>{dragItem=el.dataset.envelope;e.dataTransfer.setData('text/plain',dragItem)});let touchStart=null;el.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse')return;touchStart={x:e.clientX,y:e.clientY};el.setPointerCapture(e.pointerId)});el.addEventListener('pointerup',e=>{if(!touchStart)return;const dest=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-drop]');if(dest&&dest.dataset.drop===(el.dataset.envelope==='A'?'B':'A'))deliver(el.dataset.envelope);touchStart=null})}for(const d of document.querySelectorAll('.drop')){d.addEventListener('dragover',e=>{e.preventDefault();d.classList.add('over')});d.addEventListener('dragleave',()=>d.classList.remove('over'));d.addEventListener('drop',e=>{e.preventDefault();d.classList.remove('over');const which=e.dataTransfer.getData('text/plain');if(d.dataset.drop===(which==='A'?'B':'A'))deliver(which);else say(['Curvi','¡Ese sobre es para la otra persona!'])})}}
function renderQuiz(){const el=document.getElementById('quiz');if(!el)return;if(quizIndex>=questions.length){el.innerHTML=`<h3>¡Misión completada! ${score}/7 respuestas correctas</h3><p>Ya sabes cómo funciona el acuerdo de claves. Puedes repetir el reto.</p><button id="retry" class="primary">Repetir desafío</button>`;document.getElementById('retry').onclick=()=>{quizIndex=0;score=0;answered=false;renderQuiz()};return}const q=questions[quizIndex];el.innerHTML=`<div class="tag">PREGUNTA ${quizIndex+1} / 7 · PUNTOS: ${score}</div><h3>${q.q}</h3>${q.o.map((o,i)=>`<button class="choice" data-choice="${i}">${String.fromCharCode(65+i)}. ${o}</button>`).join('')}<p id="feedback" class="feedback"></p><button id="quizNext" class="primary" hidden>${quizIndex===6?'Ver resultado':'Siguiente pregunta →'}</button>`;document.querySelectorAll('[data-choice]').forEach(c=>c.onclick=()=>{if(answered)return;answered=true;const i=+c.dataset.choice,ok=i===q.a;if(ok)score++;document.querySelectorAll('[data-choice]').forEach(z=>{z.disabled=true;if(+z.dataset.choice===q.a)z.classList.add('correct');else if(+z.dataset.choice===i)z.classList.add('wrong')});document.getElementById('feedback').textContent=(ok?'¡Correcto! ':'Casi. ')+q.e;document.getElementById('quizNext').hidden=false;say([ok?'Ana':'Curvi',(ok?'¡Excelente! ':'¡Aprendamos juntos! ')+q.e]);sound(ok?850:250)});document.getElementById('quizNext').onclick=()=>{quizIndex++;answered=false;renderQuiz()}}
function renderLab(){const lab=document.getElementById('lab');if(!lab)return;lab.innerHTML=`<div class="panel" style="margin-top:12px"><h3>Laboratorio libre</h3><div class="grid3"><label>Ana: <b>${ana}</b><input id="labAna" class="slider" type="range" min="1" max="18" value="${ana}"></label><label>Carlos: <b>${carlos}</b><input id="labCarlos" class="slider" type="range" min="1" max="18" value="${carlos}"></label></div><p>QA = ${fmt(mul(ana))} · QB = ${fmt(mul(carlos))}</p><p><strong>SA = ${fmt(mul(ana,mul(carlos)))} · SB = ${fmt(mul(carlos,mul(ana)))}</strong></p>${plot(mul(ana,mul(carlos)))}<p class="hint">Ambas rutas coinciden. La multiplicación se hace con aritmética de puntos, no multiplicando coordenadas.</p></div>`;for(const [id,name] of [['labAna','ana'],['labCarlos','carlos']])document.getElementById(id).oninput=e=>{if(name==='ana')ana=+e.target.value;else carlos=+e.target.value;refreshStats();renderLab();updateMath()}}
window.ECDH={mod,inv,valid,add,mul,tests,fmt};render();
</script></body></html>
